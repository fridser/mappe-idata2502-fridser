name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: |
          pip install -r app/requirements.txt pytest
          pytest app
      - run: docker build -t starter-app ./app 
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name app starter-app
          timeout 30 bash -c 'until curl -sf localhost:5000/health; do sleep 1; done'
      - uses: docker/login-action@v4
        if: github.event_name == 'push' 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,} # ,, = lower case
          docker tag starter-app "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:${GITHUB_SHA::7}"