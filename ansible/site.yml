---

- name: Configure the app server
  hosts: app
  become: true

  tasks:
    - name: Greeting 
      ansible.builtin.copy:
        dest: /etc/motd
        content: "managed by Ansible changed\n"

    - name: Install Docker 
      ansible.builtin.apt:
        name: 
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Docker run permissions 
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true


    - name: Docker running 
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Put the deploy compose file on the VM # task 5, lined up with the others
      ansible.builtin.copy:
        src: ../deploy/compose.yaml
        dest: /home/ubuntu/compose.yaml
        owner: ubuntu
        group: ubuntu

    - name: Put the stack config on the VM
      ansible.builtin.copy:
        src: "../{{ item }}"        # no trailing slash = copy the folder itself
        dest: /home/ubuntu/
        owner: ubuntu
        group: ubuntu
      loop:
        - prometheus
        - alloy
        - tempo
        - grafana

    - name: Create a 2 GB swapfile
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile          # only runs if the file doesn't exist yet
      register: swapfile

    - name: Swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      when: swapfile.changed

    - name: Turn swap on
      ansible.builtin.command: swapon /swapfile
      when: swapfile.changed

    - name: Keep swap after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

