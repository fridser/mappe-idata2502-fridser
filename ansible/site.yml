---

- name: Configure the app server
  hosts: app
  become: true

  tasks:
    - name: Greeting 
      ansible.builtin.copy:
        dest: /etc/motd
        content: "managed by Ansible changed\n"

    - name: Install Docker 
      ansible.builtin.apt:
        name: 
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Docker run permissions 
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true


    - name: Docker running 
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # TODO: put your compose.yaml on the server as
    #   part of this playbook. Then the CD job only has to run
    #   `docker compose pull && up -d` - and the file on the server can never
    #   drift from the one in the repo.

