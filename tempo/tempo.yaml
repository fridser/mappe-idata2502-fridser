# Tempo: single node, traces on local disk. Receives OpenTelemetry (OTLP)
# on 4317 (gRPC) and 4318 (HTTP) - the standard ports every OpenTelemetry
# SDK sends to; the apps use 4318.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h # a lab, not an archive

# Tempo can derive METRICS from the traces: which service calls which (the
# service map in Grafana) and request rates/latencies per service. It writes
# them to Prometheus - traces feeding the metrics pillar.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
